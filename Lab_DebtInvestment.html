<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="ttl">Investment Lab</title>
<style>
:root{--bg:#fff;--panel:#f8fafc;--text:#111827;--border:#1f2937;--primary:#0b57d0;--field:#fff;--doc:#fffbe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--panel:#1e293b;--text:#f1f5f9;--border:#9ca3af;--primary:#1e3a8a;--field:#0f172a;--doc:#1c1917}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;background:var(--bg);color:var(--text)}
header{background:var(--primary);color:#fff;padding:.5rem 1rem}
h1{margin:0;font-size:1.3rem}
h2{margin:0 0 .3rem;font-size:1.05rem}
h3{margin:0 0 .3rem;font-size:.95rem}
p{margin:.3rem 0}
main{max-width:820px;margin:auto;padding:.6rem}
section{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:.55rem .75rem;margin-bottom:.6rem}
label{font-weight:bold;display:block;margin-bottom:.15rem}
input,select,textarea{padding:.25rem .4rem;border:2px solid var(--border);border-radius:4px;font-size:.95rem;background:var(--field);color:var(--text);width:100%;max-width:300px}
textarea{max-width:100%;font-family:monospace}
button{padding:.3rem .7rem;font-size:.9rem;font-weight:bold;border:2px solid var(--border);border-radius:4px;background:var(--primary);color:#fff;cursor:pointer;margin:.3rem .3rem 0 0}
button.alt{background:var(--field);color:var(--text)}
input:focus,select:focus,textarea:focus,button:focus{outline:3px solid #ffbf47;outline-offset:1px}
.doc{margin-top:.4rem;padding:.5rem;border:1px dashed var(--border);background:var(--doc)}
.doc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.1rem .6rem}
.doc dt{font-weight:bold}.doc dd{margin:0}
.row{display:flex;flex-wrap:wrap;gap:.5rem .75rem}
.row>div{flex:1 1 150px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--border);padding:.2rem .4rem;text-align:left}
[hidden]{display:none!important}
.fld input,.fld select{max-width:150px}.err{color:#842029;font-weight:bold}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#fca5a5}}
code.big{display:inline-block;padding:.15rem .5rem;border:1px dashed var(--border);background:var(--bg);font-size:1.05rem;letter-spacing:.08em}
td.n,th.n{text-align:right}
.radio label{font-weight:normal;display:inline-flex;gap:.3rem;margin-right:.75rem;align-items:center}.radio input{width:auto}
fieldset.radio{border:1px solid var(--border);padding:.3rem .6rem;margin:0}
@media (min-width:900px){.cols.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:start}.cols.two>section{margin-bottom:.6rem}}
.doc ul{margin:.2rem 0;padding-left:1.2rem}#qHint{font-size:.9em;margin:.3rem 0 0}
</style></head><body>
<header><h1 id="h1">Investment Lab</h1></header>
<main>
<section id="start"><h2>Start</h2>
<p>Enter the code shown in your exercise question.</p>
<label for="vc">Enter code
